<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/theme-init.js"></script>
    <title>NOVA PDF — the local-first PDF workstation</title>
    <meta
      name="description"
      content="Merge, split, sign, redact, compress, convert and OCR PDFs entirely in your browser. NOVA PDF never uploads your files. No account, no watermark, AES-256 encryption."
    />
    <link rel="canonical" href="https://pdf.novaecosystem.live/app/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#07080b" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NOVA PDF — every PDF tool, zero uploads" />
    <meta property="og:description" content="A complete PDF workstation that runs inside your browser. Files never leave your device." />
    <meta property="og:url" content="https://pdf.novaecosystem.live/app/" />
    <meta property="og:image" content="https://pdf.novaecosystem.live/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      html,
      body {
        margin: 0;
        background: #07080b;
        color: #eef0f5;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      html[data-theme='light'] body {
        background: #f3f2ec;
        color: #14151a;
      }
      #boot {
        min-height: 100vh;
        display: grid;
        place-items: center;
        gap: 14px;
        text-align: center;
        padding: 40px;
      }
      #boot .mark {
        width: 46px;
        height: 46px;
        border-radius: 12px;
        background: linear-gradient(150deg, #c9ff4d, #86d9ff);
        margin: 0 auto;
        animation: pulse 1.4s ease-in-out infinite;
      }
      #boot h1 {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0;
      }
      #boot p {
        margin: 0;
        color: #8a8f9d;
        font-size: 12px;
      }
      @keyframes pulse {
        50% {
          transform: scale(0.92);
          opacity: 0.7;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div class="mark"></div>
        <h1>NOVA PDF</h1>
        <p>Starting the local PDF engine…</p>
      </div>
    </div>
    <noscript>
      <div style="padding:48px;max-width:760px;margin:0 auto;font-family:ui-sans-serif,system-ui">
        <h1>NOVA PDF needs JavaScript</h1>
        <p>Every tool runs inside your browser with PDF.js and pdf-lib. Nothing is uploaded; enable JavaScript to use the workbench.</p>
        <p><a style="color:#c9ff4d" href="https://pdf.novaecosystem.live/">Read about the 32 tools</a></p>
      </div>
    </noscript>
    <script src="/nova-translate.js" defer></script>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
