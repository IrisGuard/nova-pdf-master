<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>(function(){try{var d=document.documentElement;var t=localStorage.getItem('nova-pdf-theme');if(t==='light'||t==='dark')d.setAttribute('data-theme',t);var l=new URLSearchParams(location.search).get('hl')||localStorage.getItem('nova_pdf_lang')||navigator.language||'';if(l&&String(l).toLowerCase().split('-')[0]!=='en')d.setAttribute('data-nv-pending','');}catch(e){}})();</script>
    <title>NOVA PDF — the local-first PDF workstation</title>
    <meta
      name="description"
      content="Merge, split, sign, redact, compress, convert and OCR PDFs in your browser. No uploads, no account, no watermark, AES-256 encryption."
    />
    <link rel="canonical" href="https://pdf.novaecosystem.live/app/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#07080b" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NOVA PDF — every PDF tool, zero uploads" />
    <meta property="og:description" content="A complete PDF workstation that runs inside your browser. Files never leave your device." />
    <meta property="og:url" content="https://pdf.novaecosystem.live/app/" />
    <meta property="og:image" content="https://pdf.novaecosystem.live/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://pdf.novaecosystem.live/og.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/boot.css" />
    <link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/nova-translate.css" />
    <link rel="stylesheet" href="/nova-translate.css" />
    <!-- GA4 G-FKX19KJGNL always-on (no consent banner, Owner 2026-10-25):
         the workbench reports page views + clicks only — never a file, a
         filename or extracted text. See public/analytics.js. -->
    <script src="/analytics.js" defer></script>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div class="mark"></div>
        <h1>NOVA PDF</h1>
        <p>Starting the local PDF engine…</p>
      </div>
    </div>
    <noscript>
      <div style="padding:48px;max-width:760px;margin:0 auto;font-family:ui-sans-serif,system-ui">
        <h1>NOVA PDF needs JavaScript</h1>
        <p>Every tool runs inside your browser with PDF.js and pdf-lib. Nothing is uploaded; enable JavaScript to use the workbench.</p>
        <p><a style="color:#c9ff4d" href="https://pdf.novaecosystem.live/">Read about the 32 tools</a></p>
      </div>
    </noscript>
    <script src="/nova-translate.js" defer></script>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
