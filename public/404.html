<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, follow" />
  <title>Page not found — NOVA PDF</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root { color-scheme: dark; --ink:#f4f5f8; --muted:#9aa3b2; --accent:#7c5cff; --bg:#0c0e14; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:32px;
      background: radial-gradient(900px 600px at 20% -10%, #1a1d2b 0%, var(--bg) 55%);
      color:var(--ink); font:16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width:560px; text-align:center; }
    .mark { width:56px; height:56px; margin:0 auto 24px; display:grid; place-items:center;
      border:1px solid #2a2f3f; border-radius:16px; background:#131722; }
    .mark svg { width:28px; height:28px; }
    .code { font-size:13px; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); font-weight:700; }
    h1 { margin:10px 0 12px; font-size:clamp(28px,5vw,40px); line-height:1.15; letter-spacing:-.02em; }
    p { color:var(--muted); margin:0 auto 28px; max-width:44ch; }
    .actions { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
    a { display:inline-block; padding:12px 22px; border-radius:10px; text-decoration:none; font-weight:600; font-size:15px; }
    a.primary { background:var(--accent); color:#fff; }
    a.ghost { border:1px solid #2a2f3f; color:var(--ink); }
    a:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#7c5cff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 14h8M8 17h5"/>
      </svg>
    </div>
    <div class="code">404</div>
    <h1>This page does not exist</h1>
    <p>The address may be mistyped, or the page has moved. Your documents are never uploaded, so nothing was lost here.</p>
    <div class="actions">
      <a class="primary" href="/app/">Open the workbench</a>
      <a class="ghost" href="/">Back to home</a>
    </div>
  </main>
</body>
</html>
